<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traduction Prompteur - Urdu/Hindi → Français</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="prompteur">
  <div class="prompteur-layout">
    <section class="prompteur-left">
      <div class="prompteur-badge">Traduction en direct</div>
      <div id="subtitles" class="prompteur-subtitles"></div>
    </section>

    <aside class="prompteur-right">
      <div class="prompteur-footer">
        <span class="session-info" id="sessionInfo"></span>
        <span class="prompteur-status" id="statusText">Pr?t ? d?marrer</span>
      </div>

      <div class="status-bar">
        <div class="status-indicator" id="statusIndicator">
          <span class="status-dot"></span>
          <span class="status-text">Statut</span>
        </div>
      </div>

      <div class="controls">
        <button id="startBtn" class="btn btn-primary">
          <span class="btn-icon">🎤</span>
          Démarrer la traduction
        </button>
        <button id="stopBtn" class="btn btn-danger" disabled>
          <span class="btn-icon">⏹</span>
          Arrêter
        </button>
      </div>

      <div class="controls">
        <button id="themeToggleBtn" class="btn btn-secondary" style="width: 100%; justify-content: center;">
          <span id="themeToggleIcon">🌙</span>
          <span id="themeToggleLabel">Mode noir</span>
        </button>
      </div>

      <div class="controls">
        <button id="layoutToggleBtn" class="btn btn-secondary" style="width: 100%; justify-content: center;">
          <span id="layoutToggleLabel">⇔ 50 / 50</span>
        </button>
      </div>

      <div class="vad-controls">
        <div class="vad-header">
          <span>Taille du texte</span>
          <span class="vad-status" id="fontSizeValue">3.5 rem</span>
        </div>
        <div class="vad-row">
          <div class="vad-actions" style="gap: 0.5rem; width: 100%; justify-content: center;">
            <button id="fontDecrBtn" class="btn btn-secondary btn-small" style="flex: 1; justify-content: center;">A−</button>
            <button id="fontIncrBtn" class="btn btn-secondary btn-small" style="flex: 1; justify-content: center;">A+</button>
          </div>
        </div>
      </div>

      <div class="mic-controls">
        <label class="mic-label" for="micSelect">Microphone</label>
        <div class="mic-actions">
          <select id="micSelect" class="mic-select"></select>
          <button id="micRefresh" class="btn btn-secondary btn-small">Rafraichir</button>
        </div>
      </div>

      <div class="vad-controls" id="vadControls">
        <div class="vad-header">
          <span>Semantic VAD</span>
          <span class="vad-status" id="vadStatus">Live</span>
        </div>
        <div class="vad-row">
          <span class="vad-label">Réactivité</span>
          <div class="vad-actions">
            <select class="vad-select" id="vadEagerness" data-vad="eagerness">
              <option value="low">Faible</option>
              <option value="medium">Moyenne</option>
              <option value="high" selected>Élevée</option>
              <option value="auto">Auto</option>
            </select>
          </div>
        </div>
        <div class="vad-row">
          <span class="vad-label">Prefixe (ms)</span>
          <div class="vad-actions">
            <input class="vad-slider" type="range" min="0" max="1000" step="50" value="250" data-vad="prefix" />
            <span class="vad-value" id="vadPrefixValue">250</span>
          </div>
        </div>
      </div>

      <div class="vad-controls">
        <div class="vad-header">
          <span>Vitesse défilement</span>
          <span class="vad-status" id="scrollSpeedValue">1.2 px/frame</span>
        </div>
        <div class="vad-row">
          <span class="vad-label">Ligne suivante</span>
          <div class="vad-actions">
            <input id="scrollSpeed" class="vad-slider" type="range" min="0" max="6" step="0.1" value="1.2" />
          </div>
        </div>
      </div>

      <div id="prompteurStats" class="prompteur-stats"></div>

      <div class="audio-level-container" id="audioLevelContainer" style="display: none;">
        <div class="audio-level-label">Niveau audio</div>
        <div class="audio-level-bar">
          <div class="audio-level-fill" id="audioLevel"></div>
        </div>
      </div>

      <details class="history-panel">
        <summary>Historique complet</summary>
        <div id="historyContent" class="history-content"></div>
        <button id="exportBtn" class="btn btn-secondary" style="margin-top: 1rem;">
          Exporter (TXT)
        </button>
      </details>
    </aside>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="app.js"></script>
  <script>
    (function () {
      let fontSize = 3.5;
      const step = 0.25;
      const min = 1;
      const max = 8;

      function applyFontSize() {
        document.querySelectorAll('.subtitle').forEach(el => {
          el.style.fontSize = fontSize + 'rem';
        });
        document.getElementById('fontSizeValue').textContent = fontSize.toFixed(2) + ' rem';

        // Appliquer aussi aux nouvelles subtitles via une règle CSS dynamique
        let style = document.getElementById('dynamic-font-style');
        if (!style) {
          style = document.createElement('style');
          style.id = 'dynamic-font-style';
          document.head.appendChild(style);
        }
        style.textContent = `.subtitle { font-size: ${fontSize}rem !important; }`;
      }

      document.getElementById('fontIncrBtn').addEventListener('click', function () {
        if (fontSize < max) { fontSize = Math.round((fontSize + step) * 100) / 100; applyFontSize(); }
      });

      document.getElementById('fontDecrBtn').addEventListener('click', function () {
        if (fontSize > min) { fontSize = Math.round((fontSize - step) * 100) / 100; applyFontSize(); }
      });

      // Layout toggle 70/30 ↔ 50/50
      let is5050 = false;
      const layoutBtn = document.getElementById('layoutToggleBtn');
      const layoutLabel = document.getElementById('layoutToggleLabel');
      layoutBtn.addEventListener('click', function () {
        is5050 = !is5050;
        document.querySelector('.prompteur-layout').classList.toggle('layout-50', is5050);
        layoutLabel.textContent = is5050 ? '⇔ 70 / 30' : '⇔ 50 / 50';
      });
    })();
  </script>
</body>

</html>
