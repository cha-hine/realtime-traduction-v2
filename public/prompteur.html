<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traduction Prompteur - Urdu/Hindi → Français</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Taille réduite : badge "Traduction en direct" */
    .prompteur-badge {
      font-size: 0.65rem;
    }

    /* Taille réduite : texte des paramètres (panneau de commandes) */
    .controls-panel .vad-header,
    .controls-panel .vad-label,
    .controls-panel .vad-status,
    .controls-panel .mic-label,
    .controls-panel .session-info,
    .controls-panel .prompteur-status {
      font-size: 0.72rem;
    }
  </style>
</head>

<body class="prompteur controls-hidden">
  <div class="prompteur-layout">
    <section class="prompteur-diapo" id="diapoArea">
      <div class="diapo-placeholder">Diapo</div>
    </section>

    <aside class="prompteur-side">
      <div class="prompteur-side-top" id="webcamArea">
        <div class="webcam-placeholder">🙂</div>
      </div>

      <div class="prompteur-side-bottom">
        <div class="prompteur-badge">Traduction en direct</div>
        <div id="subtitles" class="prompteur-subtitles"></div>
      </div>
    </aside>
  </div>

  <!-- Bouton flottant : afficher le panneau de commandes -->
  <button id="showControlsBtn" class="floating-btn show-controls-btn" title="Afficher les commandes"
    aria-label="Afficher les commandes">⚙</button>

  <!-- Bouton flottant : démarrer / arrêter la traduction (visible quand les commandes sont masquées) -->
  <button id="miniStartStopBtn" class="floating-btn mini-startstop-btn" title="Démarrer la traduction"
    aria-label="Démarrer la traduction">🎤</button>

  <!-- Panneau de commandes (masquable) -->
  <aside id="controlsPanel" class="controls-panel">
    <div class="controls-panel-header">
      <span>Commandes</span>
      <button id="hideControlsBtn" class="btn btn-secondary btn-small">✕ Masquer</button>
    </div>

    <div class="prompteur-footer">
      <span class="session-info" id="sessionInfo"></span>
      <span class="prompteur-status" id="statusText">Prêt à démarrer</span>
    </div>

    <!-- Ligne 1 : Statut + Démarrer + Arrêter -->
    <div style="display:flex; align-items:center; gap:0.4rem; flex-wrap:nowrap;">
      <div class="status-indicator" id="statusIndicator" style="flex-shrink:0;">
        <span class="status-dot"></span>
        <span class="status-text">Statut</span>
      </div>
      <button id="startBtn" class="btn btn-primary btn-small"
        style="flex:1; justify-content:center; white-space:nowrap;">
        <span class="btn-icon">🎤</span>
        Démarrer
      </button>
      <button id="stopBtn" class="btn btn-danger btn-small" disabled
        style="flex-shrink:0; justify-content:center; white-space:nowrap;">
        <span class="btn-icon">⏹</span>
        Arrêter
      </button>
    </div>

    <!-- Ligne 2 : Mode noir + Inverser + Taille du texte -->
    <div style="display:flex; align-items:center; gap:0.4rem; flex-wrap:nowrap;">
      <button id="themeToggleBtn" class="btn btn-secondary btn-small"
        style="flex-shrink:0; justify-content:center; white-space:nowrap;">
        <span id="themeToggleIcon">🌙</span>
        <span id="themeToggleLabel">Mode noir</span>
      </button>
      <button id="swapLayoutBtn" class="btn btn-secondary btn-small"
        style="flex-shrink:0; justify-content:center; white-space:nowrap;">
        <span id="swapLayoutLabel">⇄ Inverser</span>
      </button>
      <div style="display:flex; align-items:center; gap:0.3rem; flex:1; justify-content:flex-end; flex-wrap:nowrap;">
        <span class="vad-label" style="white-space:nowrap; font-size:0.7rem;">Texte</span>
        <span class="vad-status" id="fontSizeValue" style="white-space:nowrap; font-size:0.7rem;">2.50 rem</span>
        <button id="fontDecrBtn" class="btn btn-secondary btn-small"
          style="flex-shrink:0; justify-content:center; padding:0.2rem 0.5rem;">A−</button>
        <button id="fontIncrBtn" class="btn btn-secondary btn-small"
          style="flex-shrink:0; justify-content:center; padding:0.2rem 0.5rem;">A+</button>
      </div>
    </div>

    <!-- Ligne 3 : Largeur traduction + Hauteur traduction -->
    <div style="display:flex; align-items:center; gap:0.4rem; flex-wrap:nowrap;">
      <span class="vad-label" style="white-space:nowrap; font-size:0.7rem;">Largeur :</span>
      <button class="btn btn-secondary btn-small trad-width-btn" data-width="30"
        style="flex-shrink:0; justify-content:center; white-space:nowrap; padding:0.2rem 0.5rem;">30%</button>
      <button class="btn btn-secondary btn-small trad-width-btn" data-width="50"
        style="flex-shrink:0; justify-content:center; white-space:nowrap; padding:0.2rem 0.5rem;">50%</button>
      <button class="btn btn-secondary btn-small trad-width-btn" data-width="70"
        style="flex-shrink:0; justify-content:center; white-space:nowrap; padding:0.2rem 0.5rem;">70%</button>
      <button class="btn btn-secondary btn-small trad-width-btn" data-width="100"
        style="flex-shrink:0; justify-content:center; white-space:nowrap; padding:0.2rem 0.5rem;">100%</button>
    </div>

    <!-- Ligne 4 : Hauteur traduction -->
    <div style="display:flex; align-items:center; gap:0.4rem; flex-wrap:nowrap;">
      <span class="vad-label" style="white-space:nowrap; font-size:0.7rem;">Hauteur :</span>
      <button class="btn btn-secondary btn-small trad-height-btn" data-height="50"
        style="flex-shrink:0; justify-content:center; white-space:nowrap; padding:0.2rem 0.5rem;">50%</button>
      <button class="btn btn-secondary btn-small trad-height-btn" data-height="100"
        style="flex-shrink:0; justify-content:center; white-space:nowrap; padding:0.2rem 0.5rem;">100%</button>
    </div>

    <div class="mic-controls">
      <label class="mic-label" for="micSelect">Microphone</label>
      <div class="mic-actions">
        <select id="micSelect" class="mic-select"></select>
        <button id="micRefresh" class="btn btn-secondary btn-small">Rafraichir</button>
      </div>
    </div>

    <div class="vad-controls" id="vadControls">
      <div class="vad-header">
        <span>Semantic VAD</span>
        <span class="vad-status" id="vadStatus">Live</span>
      </div>
      <div class="vad-row">
        <span class="vad-label">Réactivité</span>
        <div class="vad-actions">
          <select class="vad-select" id="vadEagerness" data-vad="eagerness">
            <option value="low">Faible</option>
            <option value="medium">Moyenne</option>
            <option value="high" selected>Élevée</option>
            <option value="auto">Auto</option>
          </select>
        </div>
      </div>
      <div class="vad-row">
        <span class="vad-label">Prefixe (ms)</span>
        <div class="vad-actions">
          <input class="vad-slider" type="range" min="0" max="1000" step="50" value="250" data-vad="prefix" />
          <span class="vad-value" id="vadPrefixValue">250</span>
        </div>
      </div>
    </div>

    <div class="vad-controls">
      <div class="vad-header">
        <span>Vitesse défilement</span>
        <span class="vad-status" id="scrollSpeedValue">1.2 px/frame</span>
      </div>
      <div class="vad-row">
        <span class="vad-label">Ligne suivante</span>
        <div class="vad-actions">
          <input id="scrollSpeed" class="vad-slider" type="range" min="0" max="6" step="0.1" value="1.2" />
        </div>
      </div>
    </div>

    <div id="prompteurStats" class="prompteur-stats"></div>

    <div class="audio-level-container" id="audioLevelContainer" style="display: none;">
      <div class="audio-level-label">Niveau audio</div>
      <div class="audio-level-bar">
        <div class="audio-level-fill" id="audioLevel"></div>
      </div>
    </div>

    <details class="history-panel">
      <summary>Historique complet</summary>
      <div id="historyContent" class="history-content"></div>
      <button id="exportBtn" class="btn btn-secondary" style="margin-top: 1rem;">
        Exporter (TXT)
      </button>
    </details>
  </aside>

  <!-- Indicateur flottant : vitesse de défilement (visible quand commandes masquées) -->
  <div id="miniScrollIndicator" class="floating-indicator mini-scroll-indicator" title="Vitesse de défilement">
    <span class="mini-indicator-icon">⏩</span>
    <span id="miniScrollValue">1.2</span>
  </div>

  <!-- Indicateur flottant : niveau audio (visible quand commandes masquées) -->
  <div id="miniAudioIndicator" class="floating-indicator mini-audio-indicator" title="Niveau audio">
    <span id="miniAudioDot" class="mini-audio-dot"></span>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="app.js"></script>
  <script>
    (function () {
      let fontSize = 2.5;
      const step = 0.25;
      const min = 1;
      const max = 8;

      function applyFontSize() {
        document.querySelectorAll('.subtitle').forEach(el => {
          el.style.fontSize = fontSize + 'rem';
        });
        document.getElementById('fontSizeValue').textContent = fontSize.toFixed(2) + ' rem';

        // Appliquer aussi aux nouvelles subtitles via une règle CSS dynamique
        let style = document.getElementById('dynamic-font-style');
        if (!style) {
          style = document.createElement('style');
          style.id = 'dynamic-font-style';
          document.head.appendChild(style);
        }
        style.textContent = `.subtitle { font-size: ${fontSize}rem !important; }`;
      }

      document.getElementById('fontIncrBtn').addEventListener('click', function () {
        if (fontSize < max) { fontSize = Math.round((fontSize + step) * 100) / 100; applyFontSize(); }
      });

      document.getElementById('fontDecrBtn').addEventListener('click', function () {
        if (fontSize > min) { fontSize = Math.round((fontSize - step) * 100) / 100; applyFontSize(); }
      });

      // Largeur traduction : 30% / 50% / 70% / 100%
      const widthClasses = ['layout-trad-30', 'layout-trad-50', 'layout-trad-70', 'layout-trad-100'];
      const layout = document.querySelector('.prompteur-layout');
      let currentWidth = 30;

      function setTradWidth(w) {
        widthClasses.forEach(c => layout.classList.remove(c));
        if (w !== 30) layout.classList.add('layout-trad-' + w);
        currentWidth = w;
        document.querySelectorAll('.trad-width-btn').forEach(btn => {
          btn.classList.toggle('btn-active', parseInt(btn.dataset.width) === w);
        });
      }

      document.querySelectorAll('.trad-width-btn').forEach(btn => {
        btn.addEventListener('click', function () { setTradWidth(parseInt(this.dataset.width)); });
      });
      setTradWidth(30);

      // Hauteur traduction : 50% / 100%
      const side = document.querySelector('.prompteur-side');
      let currentHeight = 50;

      function setTradHeight(h) {
        side.classList.toggle('translation-full', h === 100);
        currentHeight = h;
        document.querySelectorAll('.trad-height-btn').forEach(btn => {
          btn.classList.toggle('btn-active', parseInt(btn.dataset.height) === h);
        });
      }

      document.querySelectorAll('.trad-height-btn').forEach(btn => {
        btn.addEventListener('click', function () { setTradHeight(parseInt(this.dataset.height)); });
      });
      setTradHeight(50);

      // Inversion layout : traduction à gauche / incrustation à droite
      let isSwapped = false;
      const swapLayoutBtn = document.getElementById('swapLayoutBtn');
      const swapLayoutLabel = document.getElementById('swapLayoutLabel');
      swapLayoutBtn.addEventListener('click', function () {
        isSwapped = !isSwapped;
        layout.classList.toggle('layout-swapped', isSwapped);
        swapLayoutLabel.textContent = isSwapped ? '⇄ Normal' : '⇄ Inverser';
      });

      // Affichage / masquage du panneau de commandes
      const body = document.body;
      const showControlsBtn = document.getElementById('showControlsBtn');
      const hideControlsBtn = document.getElementById('hideControlsBtn');

      function setControlsHidden(hidden) {
        body.classList.toggle('controls-hidden', hidden);
        if (hidden && document.activeElement) {
          const panel = document.getElementById('controlsPanel');
          if (panel && panel.contains(document.activeElement)) {
            document.activeElement.blur();
          }
        }
      }

      showControlsBtn.addEventListener('click', function () { setControlsHidden(false); });
      hideControlsBtn.addEventListener('click', function () { setControlsHidden(true); });

      // Bouton flottant Démarrer/Arrêter (relaie les vrais boutons du panneau)
      const miniBtn = document.getElementById('miniStartStopBtn');
      const realStartBtn = document.getElementById('startBtn');
      const realStopBtn = document.getElementById('stopBtn');

      function syncMiniBtn() {
        const isRunning = !realStopBtn.disabled;
        miniBtn.textContent = isRunning ? '⏹' : '🎤';
        miniBtn.classList.toggle('is-running', isRunning);
        const label = isRunning ? 'Arrêter la traduction' : 'Démarrer la traduction';
        miniBtn.title = label;
        miniBtn.setAttribute('aria-label', label);
      }

      miniBtn.addEventListener('click', function () {
        if (!realStopBtn.disabled) {
          realStopBtn.click();
        } else if (!realStartBtn.disabled) {
          realStartBtn.click();
        }
      });

      const btnObserver = new MutationObserver(syncMiniBtn);
      btnObserver.observe(realStartBtn, { attributes: true, attributeFilter: ['disabled'] });
      btnObserver.observe(realStopBtn, { attributes: true, attributeFilter: ['disabled'] });
      syncMiniBtn();
    })();
  </script>
</body>

</html>
