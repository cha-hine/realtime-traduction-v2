<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traduction temps réel</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>Traduction Temps Réel</h1>
      <p class="header-subtitle">Majlis &amp; séminaires → Français</p>
    </header>

    <!-- Status Bar -->
    <div class="status-bar">
      <div class="status-indicator" id="statusIndicator">
        <span class="status-dot"></span>
        <span class="status-text" id="statusText">Déconnecté</span>
      </div>
      <div class="session-info" id="sessionInfo"></div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button id="startBtn" class="btn btn-primary">
        <span class="btn-icon">🎤</span>
        Démarrer la traduction
      </button>
      <button id="stopBtn" class="btn btn-danger" disabled>
        <span class="btn-icon">⏹</span>
        Arrêter
      </button>
    </div>

    <div id="settingsHost" class="settings-host"></div>

    <!-- Subtitles Area -->
    <div class="subtitles-area">
      <div id="subtitles" class="subtitles"></div>
    </div>

    <!-- History Panel (collapsible) -->
    <details class="history-panel">
      <summary>Historique complet</summary>
      <div id="historyContent" class="history-content"></div>
      <button id="exportBtn" class="btn btn-secondary" style="margin-top: 1rem;">
        Exporter (TXT)
      </button>
    </details>
  </div>

  <!-- Toast notifications -->
  <div id="toastContainer" class="toast-container"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
